[Definition]

# Bypasses ban/unban for restored bans
norestored = 1

# Notifies the UI of a ban; detached so a slow or unreachable UI never delays the next ban.
actionban = ( event_id="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"; logpath='<logpath>'; \
     logs="$(tac $logpath 2>/dev/null | grep -a <grepopts> -wF '<ip>')"; \
     [ -z "$logs" ] && logs="$(journalctl --no-pager -r -o cat --since '-1 day' 2>/dev/null | grep -a <grepopts> -wF '<ip>')"; \
     printf '%%s' "$logs" | LC_ALL=C tr -cd '\11\12\15\40-\176' | \
     jq -cRs --arg serverId 'local' \
             --arg ip '<ip>' \
             --arg jail '<name>' \
             --arg hostname '<fq-hostname>' \
             --arg failures '<failures>' \
             '{serverId: $serverId, ip: $ip, jail: $jail, hostname: $hostname, failures: $failures, logs: .}' | \
     /usr/bin/curl --fail --silent --show-error --connect-timeout 3 --max-time 8 --retry 2 --retry-delay 1 --retry-max-time 25 --retry-connrefused -X POST 'http://127.0.0.1:8083/api/ban' \
     -H "Content-Type: application/json" \
     -H 'X-Callback-Secret: buOvm7yf4IDlHn8ZcmNfErmF7loOu2La_eCZiKGXmy' \
     -H "X-Callback-Event-ID: $event_id" \
     --data-binary @- ) </dev/null >/dev/null 2>&1 &

# Notifies the UI of an unban; detached for the same reason.
actionunban = ( event_id="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"; /usr/bin/curl --fail --silent --show-error --connect-timeout 3 --max-time 8 --retry 2 --retry-delay 1 --retry-max-time 25 --retry-connrefused -X POST 'http://127.0.0.1:8083/api/unban' \
     -H "Content-Type: application/json" \
     -H 'X-Callback-Secret: buOvm7yf4IDlHn8ZcmNfErmF7loOu2La_eCZiKGXmy' \
     -H "X-Callback-Event-ID: $event_id" \
     -d "$(jq -n --arg serverId 'local' \
                 --arg ip '<ip>' \
                 --arg jail '<name>' \
                 --arg hostname '<fq-hostname>' \
                 '{serverId: $serverId, ip: $ip, jail: $jail, hostname: $hostname}')" ) </dev/null >/dev/null 2>&1 &

actionflush = true

[Init]

# Default name of the chain
name = default

# Path to log files containing relevant lines for the abuser IP
logpath = /dev/null

# Number of log lines to include in the callback
grepmax = 200
grepopts = -m <grepmax>
