name: CI

# Same suite developers run locally with `bash scripts/run_tests.sh`:
#   - local_tests/test_syntax.sh          bash -n / python compile for every script
#   - local_tests/test_configs.sh         fail2ban config structure, cross refs, semver
#   - local_tests/test_secrets.sh         secret/leak scan over all non-ignored files
#   - local_tests/test_deploy.sh          deploy.sh/redact.sh placeholder round trip
#   - local_tests/test_ignorehost_config.sh  config.local loader of ignorehost.sh
#   - local_tests/test_skill_sync.sh      .agents/skills vs .opencode/commands parity
#   - local_tests/test_no_host_paths.sh   rejects host-specific absolute paths
#   - local_tests/test_busybox_compat.sh  permissions preserved without GNU chmod
#   - local_tests/test_yaml.sh            workflow YAML parse check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install --quiet pyyaml

      - name: Run test suite
        run: bash scripts/run_tests.sh
